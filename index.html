<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ен Ер Джи 3 ЕООД & Гуми Нира Транс - Регенерат & Транспорт</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c10;
            --bg-card: #12161f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --flag-green: #00966e;
            --flag-red: #d62828;
            --accent-green-glow: rgba(0, 150, 110, 0.4);
            --border-color: #2d3748;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* HEADER & NAVIGATION */
        header {
            position: sticky;
            top: 0;
            width: 100%;
            background: #0a0c10;
            z-index: 1000;
            border-bottom: 2px solid var(--border-color);
            padding: 15px 0;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            flex-wrap: wrap;
        }

        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 12px;
        }

        .flag-box {
            display: flex;
            flex-direction: column;
            width: 35px;
            height: 24px;
            border-radius: 3px;
            overflow: hidden;
            box-shadow: 0 0 10px var(--accent-green-glow);
        }

        .flag-stripe { flex: 1; }
        .stripe-white { background: #ffffff; }
        .stripe-green { background: var(--flag-green); }
        .stripe-red { background: var(--flag-red); }

        .logo-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 10px var(--flag-green);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav ul li a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            background-color: var(--flag-green);
            color: #fff;
        }

        /* HERO SECTION */
        .hero {
            padding: 100px 20px;
            background: linear-gradient(rgba(10, 12, 16, 0.8), rgba(10, 12, 16, 0.95)), 
                        url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
            text-align: center;
        }

        .hero h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero h1 span {
            color: var(--flag-green);
        }

        .hero p {
            font-size: 18px;
            color: var(--text-muted);
            max-width: 750px;
            margin: 0 auto 30px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 26px;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
            display: inline-block;
        }

        .btn-green { background: var(--flag-green); color: white; }
        .btn-green:hover { background: #007a59; }
        .btn-red { background: var(--flag-red); color: white; }
        .btn-red:hover { background: #b01f1f; }

        /* SECTIONS */
        section {
            padding: 70px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title h2 {
            font-size: 32px;
            text-transform: uppercase;
            border-bottom: 3px solid var(--flag-green);
            display: inline-block;
            padding-bottom: 5px;
        }

        /* TIRES */
        .tires-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .tire-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 25px;
            text-align: center;
        }

        .tire-card h3 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #fff;
        }

        .sizes-badge {
            background: rgba(0, 150, 110, 0.2);
            color: #00ffb3;
            border: 1px solid var(--flag-green);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 15px;
            display: inline-block;
        }

        .tire-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .info-notice {
            background: var(--bg-card);
            border-left: 4px solid var(--flag-green);
            padding: 20px;
            border-radius: 6px;
            margin-top: 30px;
        }

        /* TRANSPORT */
        .transport-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .transport-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .transport-card i {
            font-size: 32px;
            color: var(--flag-green);
            margin-bottom: 10px;
        }

        .countries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .country-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
        }

        .why-us-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .why-us-item {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 6px;
            border-left: 3px solid var(--flag-green);
        }

        /* ABOUT */
        .about-card {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .badge-ece {
            margin-top: 20px;
            background: rgba(214, 40, 40, 0.15);
            border: 1px solid var(--flag-red);
            color: #ff6b6b;
            padding: 10px 15px;
            border-radius: 6px;
            display: inline-block;
            font-weight: 700;
        }

        /* CONTACTS */
        .contacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .contact-box {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .contact-group {
            margin-bottom: 20px;
        }

        .contact-group h4 {
            color: var(--flag-green);
            margin-bottom: 8px;
        }

        .contact-group a {
            color: #fff;
            text-decoration: none;
        }

        .qr-card {
            background: #ffffff;
            color: #111;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            max-width: 260px;
            margin: 0 auto;
        }

        footer {
            background: #05070a;
            padding: 20px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>

                </ul>
            </nav>
