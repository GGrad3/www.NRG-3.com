<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ен Ер Джи 3 ЕООД & Гуми Нира Транс - Регенерат & Транспорт</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c10;
            --bg-card: #12161f;
            --bg-card-hover: #1a202c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --bg-white: #ffffff;
            --flag-green: #00966e;
            --flag-red: #d62828;
            --accent-green-glow: rgba(0, 150, 110, 0.4);
            --border-color: #2d3748;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* HEADER & NAVIGATION */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 2px solid var(--border-color);
        }

        .header-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        /* LOGO STYLING WITH BULGARIAN TRICOLOR & GLOW */
        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 12px;
        }

        .flag-box-wrapper {
            display: flex;
            flex-direction: column;
            width: 45px;
            height: 32px;
            box-shadow: 0 0 15px var(--accent-green-glow);
            border-radius: 3px;
            overflow: hidden;
        }

        .flag-stripe {
            flex: 1;
        }
        .stripe-white { background-color: #ffffff; }
        .stripe-green { background-color: var(--flag-green); }
        .stripe-red { background-color: var(--flag-red); }

        .logo-text-wrapper {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(0, 150, 110, 0.8), 0 0 20px rgba(0, 150, 110, 0.4);
        }

        .logo-reflection {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.25);
            transform: scaleY(-1);
            margin-top: -6px;
            user-select: none;
        }

        /* MENU ITEMS */
        nav ul {
            display: flex;
            list-style: none;
            gap: 8px;
        }

        nav ul li a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 14px;
            border-radius: 6px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        nav ul li a:hover {
            color: #ffffff;
            background-color: var(--flag-green);
            box-shadow: 0 0 12px var(--accent-green-glow);
        }

        /* HERO SECTION */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(10, 12, 16, 0.75), rgba(10, 12, 16, 0.9)), 
                        url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
            margin-top: 60px;
        }

        .hero-content h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero-content h1 span.highlight {
            color: var(--flag-green);
            text-shadow: 0 0 15px var(--accent-green-glow);
        }

        .hero-content p {
            font-size: 20px;
            color: var(--text-muted);
            max-width: 800px;
            margin: 0 auto 30px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-green {
            background-color: var(--flag-green);
            color: white;
            box-shadow: 0 0 15px var(--accent-green-glow);
        }

        .btn-green:hover {
            background-color: #007a59;
            transform: translateY(-2px);
        }

        .btn-red {
            background-color: var(--flag-red);
            color: white;
        }

        .btn-red:hover {
            background-color: #b01f1f;
            transform: translateY(-2px);
        }

        /* SECTIONS COMMON */
        section {
            padding: 90px 20px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-size: 36px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            position: relative;
        }

        .section-title h2::after {
            content: '';
            display: block;
            width: 60%;
            height: 4px;
            background: linear-gradient(90deg, #ffffff, var(--flag-green), var(--flag-red));
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* TIRES CATALOG SECTION */
        .tires-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .tire-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .tire-card:hover {
            transform: translateY(-5px);
            border-color: var(--flag-green);
            box-shadow: 0 10px 25px var(--accent-green-glow);
        }

        .tire-img-wrapper {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 10px;
            background: radial-gradient(circle, var(--accent-green-glow) 0%, transparent 70%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tire-img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            filter: drop-shadow(0 0 10px rgba(0,255,150,0.3));
        }

        .tire-card h3 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .sizes-badge {
            background-color: rgba(0, 150, 110, 0.15);
            color: #00ffb3;
            border: 1px solid var(--flag-green);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 15px;
        }

        .tire-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .info-box-notice {
            background-color: var(--bg-card);
            border-left: 4px solid var(--flag-green);
            padding: 25px;
            border-radius: 8px;
            margin-top: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* TRANSPORT SECTION */
        .transport-types {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .transport-card {
            background-color: var(--bg-card);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .transport-card i {
            font-size: 36px;
            color: var(--flag-green);
            margin-bottom: 15px;
        }

        .countries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .country-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .country-box:hover {
            border-color: var(--flag-red);
            transform: scale(1.05);
        }

        .flag-icon {
            font-size: 28px;
            margin-bottom: 5px;
            display: block;
        }

        .why-us-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .why-us-item {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
            border-left: 3px solid var(--flag-green);
        }

        /* ABOUT SECTION */
        .about-content {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 40px;
            border: 1px solid var(--border-color);
        }

        .about-content p {
            margin-bottom: 20px;
            font-size: 16px;
            color: #d1d5db;
        }

        .badge-ece {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(214, 40, 40, 0.15);
            border: 1px solid var(--flag-red);
            color: #ff6b6b;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            margin-top: 10px;
        }

        /* REGENERAT INFO */
        .regenerat-box {
            background: linear-gradient(135deg, var(--bg-card) 0%, #17202e 100%);
            padding: 35px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        /* CONTACTS & QR SECTION */
        .contacts-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }

        .contact-info-card {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .contact-group {
            margin-bottom: 25px;
        }

        .contact-group h4 {
            color: var(--flag-green);
            margin-bottom: 10px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .contact-group p, .contact-group a {
            color: var(--text-main);
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }

        .qr-section {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .qr-card-whatsapp {
            background: #ffffff;
            color: #111827;
            border-radius: 20px;
            padding: 25px;
            max-width: 280px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .qr-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 0 auto 10px;
            overflow: hidden;
            background: #ccc;
        }

        .qr-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .qr-card-whatsapp h5 {
            font-size: 16px;
            font-weight: 700;
        }

        .qr-card-whatsapp p.sub {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 15px;
        }

        .map-container {
            width: 100%;
            height: 280px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        /* FOOTER */
        footer {
            background-color: #06080b;
            padding: 30px 20px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header-container { flex-direction: column; gap: 15px; }
            nav ul { flex-wrap: wrap; justify-content: center; }
            .hero-content h1 { font-size: 32px; }
        }
    </style>
</head>
<body>

            <a href="#" class="logo-container">
